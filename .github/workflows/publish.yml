name: Publish Python Package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # REQUIRED for trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build
        working-directory: ./python

      - name: Generate SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment -o sbom.json
        working-directory: ./python
        continue-on-error: true

      - name: Publish to PyPI
        # v1.14.2 or newer is required: it bundles twine 7, which accepts core
        # packaging metadata 2.5. hatchling is unpinned above, so the runner
        # builds with a current hatchling that emits 2.5, and the twine 6.1.0 in
        # v1.13.0 rejected it ("'2.5' is not a valid metadata version").
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: python/dist/
