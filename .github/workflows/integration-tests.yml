name: Integration Tests

on:
  # Run on manual trigger
  workflow_dispatch:
  # Run on schedule (once a day to verify bot still works)
  schedule:
    - cron: '0 12 * * *'  # Daily at noon UTC
  # Optionally run on PR when labeled
  pull_request:
    types: [labeled]

jobs:
  integration-node:
    name: Node.js Integration Test
    # Only run if manually triggered, scheduled, or PR has 'test:integration' label
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'test:integration'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          # Single source of truth: the "packageManager" field in
          # node/package.json. pnpm 11 dropped support for reading
          # "pnpm.overrides" from package.json, and those overrides carry this
          # package's CVE pins (lodash, brace-expansion, js-yaml, esbuild,
          # @babel/core), so the pnpm major must stay pinned until they move to
          # pnpm-workspace.yaml.
          package_json_file: node/package.json

      - name: Install dependencies
        # Frozen: a lockfile that drifts from package.json means the overrides
        # above silently stopped applying. Fail instead of resolving around it.
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run bidirectional e2e test
        env:
          WEBEX_BOT_TOKEN: ${{ secrets.WEBEX_BOT_TOKEN }}
          WEBEX_BOT_TOKEN_TEST: ${{ secrets.WEBEX_BOT_TOKEN_TEST }}
        run: node test-e2e.js
        timeout-minutes: 2

  integration-python:
    name: Python Integration Test
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'test:integration'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest pytest-asyncio aiohttp

      - name: Run integration test
        env:
          WEBEX_BOT_TOKEN: ${{ secrets.WEBEX_BOT_TOKEN }}
          WEBEX_BOT_TOKEN_TEST: ${{ secrets.WEBEX_BOT_TOKEN_TEST }}
        run: pytest tests/test_integration.py -v
        timeout-minutes: 2

  integration-go:
    name: Go Integration Test
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'test:integration'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: go/go.sum

      - name: Install dependencies
        run: go mod download

      - name: Run integration test
        env:
          WEBEX_BOT_TOKEN: ${{ secrets.WEBEX_BOT_TOKEN }}
          WEBEX_BOT_TOKEN_TEST: ${{ secrets.WEBEX_BOT_TOKEN_TEST }}
        run: go test -v -run TestIntegration
        timeout-minutes: 2

  integration-rust:
    name: Rust Integration Test
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'test:integration'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}

      - name: Run integration test
        env:
          WEBEX_BOT_TOKEN: ${{ secrets.WEBEX_BOT_TOKEN }}
          WEBEX_BOT_TOKEN_TEST: ${{ secrets.WEBEX_BOT_TOKEN_TEST }}
        run: cargo test --test live_integration_test -- --ignored --nocapture
        timeout-minutes: 2
