[package]
name = "webex-message-handler"
version = "0.1.0"
edition = "2021"
description = "Lightweight Webex Mercury WebSocket + KMS decryption for receiving bot messages without the full Webex SDK"
license = "MIT"
repository = "https://github.com/ecopelan/webex-message-handler-rs"
keywords = ["webex", "mercury", "websocket", "kms", "bot"]
categories = ["network-programming", "web-programming"]
rust-version = "1.75"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tracing = "0.1"
url = "2"
futures-util = "0.3"
base64 = "0.22"
p256 = { version = "0.13", features = ["ecdh", "jwk"] }
hkdf = "0.12"
sha1 = "0.10"
sha2 = "0.10"
rand = "0.8"
aes-gcm = "0.10"
aes-kw = "0.2"
rsa = { version = "0.9", features = ["sha2"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wiremock = "0.6"

[[example]]
name = "basic_bot"
path = "examples/basic_bot.rs"
