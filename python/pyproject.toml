[build-system]
# Pinned exactly, not for security but for a reproducible publish. An unpinned
# hatchling silently moved to 1.32.0, which writes Metadata-Version 2.5, and the
# 0.6.16 PyPI upload failed twine's pre-upload check until the publish workflow
# moved to twine 7. Bumping this is a deliberate act: rebuild and check the
# resulting Metadata-Version against the twine in .github/workflows/publish.yml.
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "webex-message-handler"
version = "0.6.17"
description = "Lightweight Webex Mercury WebSocket + KMS decryption for receiving bot messages without the full Webex SDK"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Ergon Copeland" },
]
keywords = ["webex", "mercury", "websocket", "kms", "bot", "messaging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Framework :: AsyncIO",
]
dependencies = [
    "aiohttp>=3.14.1",
    "cryptography>=48.0.1",
    "jwcrypto>=1.5.7",
]

[project.urls]
Homepage = "https://github.com/3rg0n/webex-message-handler"
Repository = "https://github.com/3rg0n/webex-message-handler"

[tool.hatch.build.targets.wheel]
packages = ["src/webex_message_handler"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]
